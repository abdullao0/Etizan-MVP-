<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة حالات المادة | إتزان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Almarai:wght@300;400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="bg-canvas"></div>

    <nav class="glass-nav">
        <div class="logo">
            <span class="icon-atom">
                <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="8" fill="url(#logo-grad)" />
                    <ellipse cx="50" cy="50" rx="45" ry="18" stroke="url(#logo-grad)" stroke-width="2"
                        transform="rotate(0 50 50)" opacity="0.8" />
                    <ellipse cx="50" cy="50" rx="45" ry="18" stroke="url(#logo-grad)" stroke-width="2"
                        transform="rotate(60 50 50)" opacity="0.6" />
                    <ellipse cx="50" cy="50" rx="45" ry="18" stroke="url(#logo-grad)" stroke-width="2"
                        transform="rotate(-60 50 50)" opacity="0.6" />
                    <defs>
                        <linearGradient id="logo-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="var(--primary)" />
                            <stop offset="1" stop-color="var(--accent)" />
                        </linearGradient>
                    </defs>
                </svg>
            </span>
            <h1 onclick="window.location.href='index.html'">إتزان <span>Etizan</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="lab.html">المختبر</a></li>
        </ul>
        <a href="index.html#beta" class="btn-primary" style="text-decoration: none;">انضم للنسخة التجريبية</a>
    </nav>

    <main>
        <section class="sim-section">
            <div class="sim-header reveal">
                <h2 class="badge">محاكاة تفاعلية</h2>
                <h1>حالات المادة</h1>
                <p>لاحظ تأثير الحرارة على حركة الجزيئات وترتيبها.</p>
            </div>

            <div class="sim-container reveal">
                <div
                    style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <a href="lab.html" class="btn-secondary"
                        style="text-decoration: none; padding: 0.6rem 1.2rem; font-size: 0.95rem;"><i
                            data-lucide="arrow-right"></i> العودة للمختبر</a>
                    <h3 style="color: var(--primary); font-weight: 800;">المعمل الافتراضي</h3>
                </div>

                <canvas id="simCanvas" class="sim-canvas" width="800" height="450"></canvas>

                <div class="sim-controls">
                    <div class="control-group">
                        <label for="materialSelect"><i data-lucide="beaker"></i> نوع المادة</label>
                        <select id="materialSelect" class="form-group select">
                            <option value="water">الماء (H₂O)</option>
                            <option value="argon">الأرجون (Ar)</option>
                            <option value="oxygen">الأكسجين (O₂)</option>
                            <option value="neon">النيون (Ne)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="stateSelect"><i data-lucide="box"></i> الحالة الفيزيائية</label>
                        <select id="stateSelect" class="form-group select">
                            <option value="solid">صلبة (Solid)</option>
                            <option value="liquid">سائلة (Liquid)</option>
                            <option value="gas">غازية (Gas)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="tempSlider"><i data-lucide="thermometer"></i> الحرارة: <span
                                    id="tempDisplay">50°C</span></label>
                            <select id="unitSelect" style="width: auto; padding: 0.3rem 0.5rem; font-size: 0.75rem;">
                                <option value="C">°C</option>
                                <option value="K">K</option>
                                <option value="F">°F</option>
                            </select>
                        </div>
                        <input type="range" id="tempSlider" min="0" max="100" value="50">
                    </div>
                </div>

                <div id="stateDetails"
                    style="padding: 1.5rem; background: rgba(0, 168, 204, 0.05); border-radius: 20px; border: 1px solid rgba(0, 168, 204, 0.1); width: 100%; text-align: right;">
                    <h3 style="color: var(--primary); margin-bottom: 0.5rem;"><i data-lucide="info"></i> خصائص الحالة
                    </h3>
                    <p id="stateDesc">الجزيئات متقاربة جداً وتتحرك في مكانها، المادة لها شكل وحجم ثابت.</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="glass-footer">
        <p>جميع الحقوق محفوظة &copy; 2026 إتزان (Etizan)</p>
    </footer>

    <script src="main.js"></script>
    <script>
        (function () {
            lucide.createIcons();

            // Reveal animations
            const observerOptions = { threshold: 0.1 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('reveal-visible');
                });
            }, observerOptions);
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

            // Force visibility check for elements already in view
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => {
                    if (el.getBoundingClientRect().top < window.innerHeight) {
                        el.classList.add('reveal-visible');
                    }
                });
            }, 500);

            // Simulation Logic
            const canvas = document.getElementById('simCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let state = 'solid';
            let tempPercentage = 50;
            let unit = 'C';
            let currentMaterial = 'water';

            const materialProps = {
                water: { baseColor: [0, 168, 204], size: 10, melt: 20, boil: 80 },
                argon: { baseColor: [155, 89, 182], size: 12, melt: 10, boil: 40 },
                oxygen: { baseColor: [231, 76, 60], size: 8, melt: 5, boil: 25 },
                neon: { baseColor: [230, 126, 34], size: 9, melt: 5, boil: 15 }
            };

            const tempDisplay = document.getElementById('tempDisplay');
            const unitSelect = document.getElementById('unitSelect');
            const materialSelect = document.getElementById('materialSelect');
            const stateSelect = document.getElementById('stateSelect');
            const tempSlider = document.getElementById('tempSlider');

            function updateTempDisplay() {
                let val;
                if (unit === 'C') val = tempPercentage + "°C";
                else if (unit === 'K') val = (tempPercentage + 273.15).toFixed(2) + " K";
                else val = (tempPercentage * 9 / 5 + 32).toFixed(1) + "°F";
                tempDisplay.textContent = val;
                autoUpdateState();
            }

            function autoUpdateState() {
                const props = materialProps[currentMaterial];
                let newState = 'solid';
                if (tempPercentage >= props.boil) newState = 'gas';
                else if (tempPercentage >= props.melt) newState = 'liquid';

                if (state !== newState) {
                    state = newState;
                    stateSelect.value = state;
                    updateStateUI();
                }
            }

            function updateStateUI() {
                const desc = document.getElementById('stateDesc');
                if (state === 'solid') {
                    arrangeSolid();
                    desc.textContent = "الجزيئات متقاربة جداً وتتحرك في مكانها، المادة لها شكل وحجم ثابت.";
                } else if (state === 'liquid') {
                    desc.textContent = "الجزيئات تتحرك بحرية أكبر وتنزلق فوق بعضها، المادة لها حجم ثابت ولكن تأخذ شكل الإناء.";
                } else {
                    desc.textContent = "الجزيئات تتحرك بسرعة عالية وفي جميع الاتجاهات، المادة ليس لها شكل أو حجم ثابت.";
                }
            }

            function getParticleColor() {
                const base = materialProps[currentMaterial].baseColor;
                const factor = tempPercentage / 100;
                const r = Math.min(255, base[0] + factor * 150);
                const g = Math.min(255, base[1] + factor * 50);
                const b = Math.max(0, base[2] - factor * 100);
                return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
            }

            function initParticles() {
                particles = [];
                const count = 80;
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: 0,
                        vy: 0,
                        targetX: 0,
                        targetY: 0
                    });
                }
                if (state === 'solid') arrangeSolid();
            }

            function arrangeSolid() {
                const cols = 10;
                const spacing = 45;
                const offsetX = (canvas.width - (cols * spacing)) / 2 + 20;
                const offsetY = (canvas.height - (Math.ceil(particles.length / cols) * spacing)) / 2 + 20;
                particles.forEach((p, i) => {
                    p.targetX = offsetX + (i % cols) * spacing;
                    p.targetY = offsetY + Math.floor(i / cols) * spacing;
                    if (p.x === 0 || p.y === 0) {
                        p.x = p.targetX;
                        p.y = p.targetY;
                    }
                });
            }

            function updateParticles() {
                particles.forEach(p => {
                    let speed = (tempPercentage / 100) * 5;
                    if (state === 'solid') {
                        speed *= 0.15;
                        const dx = p.targetX - p.x;
                        const dy = p.targetY - p.y;
                        p.vx += dx * 0.05 + (Math.random() - 0.5) * speed;
                        p.vy += dy * 0.05 + (Math.random() - 0.5) * speed;
                        p.vx *= 0.8; p.vy *= 0.8;
                    } else if (state === 'liquid') {
                        speed *= 0.8;
                        p.vx += (Math.random() - 0.5) * speed;
                        p.vy += (Math.random() - 0.5) * speed;
                        p.vy += 0.15; p.vx *= 0.98; p.vy *= 0.98;
                    } else {
                        speed *= 2.5;
                        p.vx += (Math.random() - 0.5) * speed;
                        p.vy += (Math.random() - 0.5) * speed;
                        p.vx *= 0.99; p.vy *= 0.99;
                    }
                    p.x += p.vx; p.y += p.vy;
                    const radius = materialProps[currentMaterial].size;
                    if (p.x < radius) { p.x = radius; p.vx *= -0.8; }
                    if (p.x > canvas.width - radius) { p.x = canvas.width - radius; p.vx *= -0.8; }
                    if (p.y < radius) { p.y = radius; p.vy *= -0.8; }
                    if (p.y > canvas.height - radius) { p.y = canvas.height - radius; p.vy *= -0.8; }
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const color = getParticleColor();
                const size = materialProps[currentMaterial].size;
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.shadowBlur = 15; ctx.shadowColor = color; ctx.fillStyle = color; ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(p.x - size / 3, p.y - size / 3, size / 3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
                });
            }

            function simLoop() {
                updateParticles();
                drawParticles();
                requestAnimationFrame(simLoop);
            }

            initParticles();
            simLoop();

            materialSelect.addEventListener('change', e => { currentMaterial = e.target.value; initParticles(); updateTempDisplay(); });
            stateSelect.addEventListener('change', e => {
                state = e.target.value;
                const props = materialProps[currentMaterial];
                if (state === 'solid') tempPercentage = Math.max(0, props.melt - 5);
                else if (state === 'liquid') tempPercentage = Math.floor((props.melt + props.boil) / 2);
                else tempPercentage = Math.min(100, props.boil + 5);
                tempSlider.value = tempPercentage;
                updateStateUI(); updateTempDisplay();
            });
            tempSlider.addEventListener('input', e => { tempPercentage = parseInt(e.target.value); updateTempDisplay(); });
            unitSelect.addEventListener('change', e => { unit = e.target.value; updateTempDisplay(); });

            updateTempDisplay();
        })();
    </script>
</body>

</html>
